worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript;
  server {
    listen ${PORT};
    root /usr/share/nginx/html;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "script-src 'self'" always;
    location = /health { return 200 'ok'; add_header Content-Type text/plain; }
    # the app's own files change with each release, so browsers check for a new copy
    location ~* ^/(index\.html|js/) {
      # add_header here replaces the server-level ones, so they are repeated
      add_header Cache-Control "no-cache" always;
      add_header X-Robots-Tag "noindex" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "script-src 'self'" always;
      try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
