# Deploys public/ to Firebase Hosting (project rectify-b5f55) on every push to main.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT_RECTIFY_B5F55 (a Firebase service account key, JSON).
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECTIFY_B5F55 }}
          channelId: live
          projectId: rectify-b5f55
